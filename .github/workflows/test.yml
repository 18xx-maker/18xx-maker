env:
  PLAYWRIGHT_BROWSERS_PATH: browsers
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
name: Test
# A new push to a pull request supersedes its running checks
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Jobs are ordered by cost: each tier only starts when the cheaper one before
# it passed, so a quick failure stops the expensive jobs from running at all.
#   1. Lint and PR body (cheap Linux jobs, no browser)
#   2. Build and Linux shards (Linux, builds and the full vitest suite)
#   3. End to End and Export Linux (Linux, build and drive Playwright/Electron)
#   4. Mac and Windows: test shards and Export (10x and 2x minute multipliers)
jobs:
  # Edits of the PR body are checked by pr-body.yml, this runs it on every push
  pr-body:
    name: Release notes safe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
      - name: Node
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check PR body
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-pr-body.mjs
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: PNPM
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Node
        uses: actions/setup-node@v7
        with:
          cache: "pnpm"
          node-version: 24
      - name: Dependencies
        run: pnpm install
      - name: Commitlint
        run: pnpm --silent commitlint -l
      - name: Prettier
        run: pnpm --silent pretty
      - name: ESLint
        run: pnpm --silent lint
      - name: 18xx Maker Validate
        run: pnpm --silent validate
        env:
          FORCE_COLOR: 3
  build:
    name: Build
    needs: [lint, pr-body]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: PNPM
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Node
        uses: actions/setup-node@v7
        with:
          cache: "pnpm"
          node-version: 24
      - name: Dependencies
        run: pnpm install
      - name: Build Web
        run: pnpm build
      - name: Build App
        run: pnpm build:app
      - name: Build Storybook
        run: pnpm build:sb
  # The required checks are the Linux, Mac and Windows jobs further down, which
  # collect the results of these sharded jobs.
  linux-shards:
    name: Linux Shard ${{ matrix.shard }}
    needs: [lint, pr-body]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: PNPM
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Node
        uses: actions/setup-node@v7
        with:
          cache: "pnpm"
          node-version: 24
      - name: Dependencies
        run: pnpm install
      - name: Playwright Version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(pnpm exec playwright --version | awk '{ print $2 }')" >> $GITHUB_OUTPUT
      - name: Playwright Cache
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: browsers
          key: linux-playwright-${{ steps.playwright-version.outputs.PLAYWRIGHT_VERSION }}
      - name: Playwright Install
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium --only-shell --with-deps
      - name: Playwright Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          # Only run the slow apt install when the runner image lacks a library
          shell=$(find browsers -type f \( -name chrome-headless-shell -o -name headless_shell \) | head -n 1)
          if [ -z "$shell" ] || ldd "$shell" | grep -q "not found"; then
            pnpm exec playwright install-deps chromium
          fi
      # Coverage is recorded in the blob and the floors are checked after merging
      - name: Test
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/3 --reporter=default --reporter=blob
        env:
          VITEST_SHARD: 1
      - name: Upload Blob Report
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: .vitest/blob/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
  linux:
    name: Linux
    needs: linux-shards
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Shards
        run: |
          if [ "${{ needs.linux-shards.result }}" != "success" ]; then
            echo "Test shards: ${{ needs.linux-shards.result }}"
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v7
      - name: PNPM
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Node
        uses: actions/setup-node@v7
        with:
          cache: "pnpm"
          node-version: 24
      - name: Dependencies
        run: pnpm install
      - name: Download Blob Reports
        uses: actions/download-artifact@v8
        with:
          path: .vitest/blob
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge Reports and Check Coverage
        run: pnpm exec vitest run --merge-reports
      - name: Coverage
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
  # Pull requests only run the unit tests on Mac and Windows, the full suite
  # runs on main and in the merge queue
  desktop-shards:
    name: ${{ matrix.os.name }} Shard ${{ matrix.shard }}
    needs: [e2e, export-linux]
    runs-on: ${{ matrix.os.image }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: Mac
            slug: mac
            image: macos-latest
          - name: Windows
            slug: windows
            image: windows-latest
        shard: ${{ fromJSON(github.event_name == 'pull_request' && '[1]' || '[1, 2]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: PNPM
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Node
        uses: actions/setup-node@v7
        with:
          cache: "pnpm"
          node-version: 24
      - name: Dependencies
        run: pnpm install
      - name: Playwright Version
        if: github.event_name != 'pull_request'
        id: playwright-version
        shell: bash
        run: echo "PLAYWRIGHT_VERSION=$(pnpm exec playwright --version | awk '{ print $2 }')" >> $GITHUB_OUTPUT
      - name: Playwright Cache
        if: github.event_name != 'pull_request'
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: browsers
          key: ${{ matrix.os.slug }}-playwright-${{ steps.playwright-version.outputs.PLAYWRIGHT_VERSION }}
      - name: Playwright Install
        if: github.event_name != 'pull_request' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium --only-shell
      - name: Unit Tests
        if: github.event_name == 'pull_request'
        run: pnpm exec vitest run --project unit --coverage.enabled=false
      - name: Test
        if: github.event_name != 'pull_request'
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/2 --coverage.enabled=false
  mac:
    name: Mac
    needs: desktop-shards
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Shards
        run: |
          # Mac and Windows shards share one result, the failed shard job names the system
          test "${{ needs.desktop-shards.result }}" = "success"
  windows:
    name: Windows
    needs: desktop-shards
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Shards
        run: |
          test "${{ needs.desktop-shards.result }}" = "success"
  e2e:
    name: End to End
    needs: [build, linux-shards]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: PNPM
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Node
        uses: actions/setup-node@v7
        with:
          cache: "pnpm"
          node-version: 24
      - name: Dependencies
        run: pnpm install
      - name: Playwright Version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(pnpm exec playwright --version | awk '{ print $2 }')" >> $GITHUB_OUTPUT
      - name: Playwright Cache
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: browsers
          key: linux-playwright-${{ steps.playwright-version.outputs.PLAYWRIGHT_VERSION }}
      - name: Playwright Install
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium --only-shell --with-deps
      - name: Playwright Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          # Only run the slow apt install when the runner image lacks a library
          shell=$(find browsers -type f \( -name chrome-headless-shell -o -name headless_shell \) | head -n 1)
          if [ -z "$shell" ] || ldd "$shell" | grep -q "not found"; then
            pnpm exec playwright install-deps chromium
          fi
      - name: Build Web
        run: pnpm build
      - name: End to End Tests
        run: pnpm test:e2e
      - name: Upload Report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  # The six real export paths, {CLI, app} x {pdf, png, b18}, on the built site
  # and the built app with no mocks. To require them, require the three
  # "Export Linux", "Export Mac" and "Export Windows" checks.
  # The six real export paths, {CLI, app} x {pdf, png, b18}, on the built site
  # and the built app with no mocks. To require them, require the three
  # "Export Linux", "Export Mac" and "Export Windows" checks.
  export-linux:
    name: Export Linux
    needs: [build, linux-shards]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: PNPM
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Node
        uses: actions/setup-node@v7
        with:
          cache: "pnpm"
          node-version: 24
      - name: Dependencies
        run: pnpm install
      - name: Playwright Version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(pnpm exec playwright --version | awk '{ print $2 }')" >> $GITHUB_OUTPUT
      - name: Playwright Cache
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: browsers
          key: linux-playwright-${{ steps.playwright-version.outputs.PLAYWRIGHT_VERSION }}
      - name: Playwright Install
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium --only-shell --with-deps
      - name: Playwright Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          shell=$(find browsers -type f \( -name chrome-headless-shell -o -name headless_shell \) | head -n 1)
          if [ -z "$shell" ] || ldd "$shell" | grep -q "not found"; then
            pnpm exec playwright install-deps chromium
          fi
      - name: Build Web
        run: pnpm build
      - name: Build App
        run: pnpm build:app
      # Electron needs a display on Linux, and the libraries of its windows
      - name: Electron Dependencies
        run: sudo apt-get install -y xvfb libgbm1 libnss3 libasound2t64 libgtk-3-0t64
      - name: Export Tests
        run: xvfb-run --auto-servernum pnpm test:export
        env:
          E2E_ELECTRON: 1
      - name: Upload Report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: export-report-linux
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  export-desktop:
    name: Export ${{ matrix.os.name }}
    needs: [e2e, export-linux]
    runs-on: ${{ matrix.os.image }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: Mac
            slug: mac
            image: macos-latest
          - name: Windows
            slug: windows
            image: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: PNPM
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Node
        uses: actions/setup-node@v7
        with:
          cache: "pnpm"
          node-version: 24
      - name: Dependencies
        run: pnpm install
      - name: Playwright Version
        id: playwright-version
        shell: bash
        run: echo "PLAYWRIGHT_VERSION=$(pnpm exec playwright --version | awk '{ print $2 }')" >> $GITHUB_OUTPUT
      - name: Playwright Cache
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: browsers
          key: ${{ matrix.os.slug }}-playwright-${{ steps.playwright-version.outputs.PLAYWRIGHT_VERSION }}
      - name: Playwright Install
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium --only-shell
      - name: Build Web
        run: pnpm build
      - name: Build App
        run: pnpm build:app
      - name: Export Tests
        run: pnpm test:export
        env:
          E2E_ELECTRON: 1
      - name: Upload Report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: export-report-${{ matrix.os.slug }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
