# Pushes are checked by the Release notes safe job of test.yml, this re-checks
# after the PR description is edited
name: PR body

on:
  pull_request:
    types: [edited]

permissions:
  contents: read

jobs:
  pr-body:
    name: Release notes safe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-pr-body.mjs
