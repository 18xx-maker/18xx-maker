env:
  PLAYWRIGHT_BROWSERS_PATH: browsers
on:
  workflow_dispatch:
name: Update Chrome Baselines
jobs:
  baselines:
    name: Generate chrome screenshot baselines
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: PNPM
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Node
        uses: actions/setup-node@v7
        with:
          cache: "pnpm"
          node-version: 24
      - name: Dependencies
        run: pnpm install
      - name: Playwright Install
        run: pnpm exec playwright install chromium --only-shell --with-deps
      - name: Build Web
        run: pnpm build
      - name: Generate Baselines
        run: pnpm exec playwright test e2e/chrome-screenshots.spec.js --update-snapshots=all
      - name: Upload Baselines
        uses: actions/upload-artifact@v7
        with:
          name: chrome-baselines
          path: e2e/chrome-screenshots.spec.js-snapshots/
          retention-days: 7
